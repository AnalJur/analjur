  <!-- Right chain -->
  <rect x="30" y="13.5" width="3" height="7" rx="1.5" fill="#C9A227"/>
  <!-- Right pan / plate -->
  <rect x="24" y="20.5" width="13" height="4" rx="2" fill="#C9A227"/>

  <!-- Base -->
