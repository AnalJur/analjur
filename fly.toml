[app]
name = "analjur-api"
primary_region = "gru"

[build]
dockerfile = "Dockerfile"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
grace_period = "30s"
interval = "30s"
method = "GET"
path = "/health"
timeout = "10s"

[env]
PORT = "8000"

[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1
